# Déploiement : la forge construit, l'agent déploie.
#
# La forge n'ouvre plus de session SSH vers le serveur. Elle publie l'image, puis DEMANDE à
# l'agent — qui vit déjà sur la machine — de la mettre en service.
#
# Trois raisons, toutes constatées en production :
#
#   1. UN SEUL DÉPLOYEUR. Quand la forge et l'agent déployaient tous deux, l'agent repassait
#      derrière et écrasait ce que la forge venait d'écrire — les deux jobs restant verts. Une
#      panne invisible est bien pire qu'une panne franche.
#   2. PAS DE SSH. C'est le maillon le plus fragile : refus et délais dépassés à répétition,
#      alors même que les services répondaient normalement.
#   3. UN SEUL ENDROIT POUR LES SECRETS. Le mot de passe applicatif vivait à trois endroits et
#      deux étaient périmés — c'est ce qui a mis la boutique hors ligne. Il n'appartient plus
#      qu'à l'agent.
#
# L'ordre est garanti par `workflow_run` : on ne déclenche qu'après une publication RÉUSSIE,
# donc l'image existe forcément quand l'agent va la chercher.
name: Deploy (server)

on:
  workflow_run:
    workflows: ["Publish Docker image (GHCR)"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'yowyob/ksm-eshop' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Demander le déploiement à l'agent
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          set -euo pipefail
          reponse=$(curl -sS --fail-with-body --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${AGENT_TOKEN}" \
            "https://kernel-core.yowyob.com/_agent/deploy/shop")
          echo "$reponse"
          echo "$reponse" | grep -q '"accepted": *true'

      - name: Vérifier que la boutique répond
        run: |
          set -euo pipefail
          # L'agent déploie de façon asynchrone : on laisse le temps au conteneur de démarrer,
          # puis on vérifie nous-mêmes. L'agent a sa propre sonde et son propre repli ; ce
          # contrôle-ci sert à ce que l'échec soit VISIBLE ici, et pas seulement dans ses journaux.
          for tentative in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://shop.yowyob.com/ || echo 000)
            if [ "$code" = "200" ]; then echo "Boutique en ligne (HTTP 200)."; exit 0; fi
            echo "tentative ${tentative} : HTTP ${code}"
            sleep 15
          done
          echo "La boutique ne répond pas 200 après le déploiement." >&2
          exit 1
